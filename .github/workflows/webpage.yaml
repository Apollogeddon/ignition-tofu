name: Webpage

# Pull requests run it from .index.yaml, before the Dependabot merge, and a release runs it
# again from there once GoReleaser has attached the release's files.
on:
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webpage-${{ github.ref }}
  # never cancel a run on main, or the site is left half deployed
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # the root tooling installs @apollogeddon/forgejs from GitHub Packages
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: webpage/.nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
          registry-url: "https://npm.pkg.github.com"
          scope: "@apollogeddon"

      - name: Install dependencies
        run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint markdown
        run: npx markdownlint-cli2 "**/*.{md,mdx}"

  # forgejs's website pipeline: Gitleaks over the whole repository, OSV-Scanner, Biome, the
  # type check and the build, then on main the GitHub Pages deploy and OSV security patches.
  # Before each install it generates the provider reference from the provider's schema, and
  # the provider network mirror the site serves at /providers/ from the releases.
  site:
    needs: [markdown]
    uses: apollogeddon/forgejs/.github/workflows/website.yml@main
    # GitHub checks every called job's permissions, including the ones these inputs skip
    permissions:
      contents: write
      packages: read
      # Gitleaks comments on the pull request when it finds a secret
      pull-requests: write
      pages: write
      id-token: write
    with:
      working_directory: webpage
      run_tests: false
      # the site deploys from main; release-please versions the provider
      enable_versioning: false
      # .index.yaml asks for Dependabot's reviews and merges its pull requests
      auto_merge: false
      review_dependabot: false
      # the built site, served under its GitHub Pages path: its internal links, and every page
      # in the sitemap against WCAG 2.2 A and AA with axe
      base_path: /ignition-tofu/
      check_links: true
      check_accessibility: true
      setup_go: go.mod
      pre_build_command: |
        cd ..
        bash .github/scripts/ci/generate-docs.sh
        bash .github/scripts/ci/migrate-docs.sh
        bash .github/scripts/ci/generate-mirror.sh
    secrets:
      # generate-mirror.sh lists the releases and downloads their SHA256SUMS
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
