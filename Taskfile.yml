version: '3'
vars:
  TASK: go tool -modfile=.forgego/task/go.mod task
  GOVULNCHECK: go tool -modfile=.forgego/govulncheck/go.mod govulncheck
  FORGEGO: go tool -modfile=.forgego/forgego/go.mod forgego
  LEFTHOOK: go tool -modfile=.forgego/lefthook/go.mod lefthook
  GOLANGCI_LINT: go tool -modfile=.forgego/golangci-lint/go.mod golangci-lint
  VERSION: dev
  GOTESTSUM: go tool -modfile=.forgego/gotestsum/go.mod gotestsum
tasks:
  security:
    desc: Report known vulnerabilities the code calls
    cmds:
      - '{{.GOVULNCHECK}} ./...'
  sync:
    desc: Refresh the files forgego manages in .forgego/ and .golangci.yml
    cmds:
      - '{{.FORGEGO}} sync'
  sync-check:
    desc: Fail if a file forgego manages is out of date
    cmds:
      - '{{.FORGEGO}} sync --check'
  hooks:
    desc: Install the git hooks
    cmds:
      - '{{.LEFTHOOK}} install'
  lint:
    desc: Format, then lint and fix what can be fixed
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'
      - '{{.GOLANGCI_LINT}} run --fix'
  format:
    desc: Format the code
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'
  type:
    desc: Type-check and vet every package
    cmds:
      - go vet ./...
  build:
    desc: Build the provider into dist/
    cmds:
      - go build -trimpath -ldflags "-X main.version={{.VERSION}}" -o dist/terraform-provider-ignition{{exeExt}} .
  release:snapshot:
    desc: Build every release binary into dist/ without publishing
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@v2.18.2 release --snapshot --clean --skip=sign
  test:
    desc: Run the tests with coverage and a JUnit report, against OpenTofu
    env:
      TF_ACC_PROVIDER_HOST: registry.opentofu.org
    cmds:
      - TF_ACC_TERRAFORM_PATH="$(.github/scripts/install-tofu.sh)" {{.GOTESTSUM}} --junitfile junit-report.xml -- -race -coverprofile=coverage.out -covermode=atomic ./...
  test:acc:
    desc: Run the acceptance tests against a running gateway (docker compose up), with OpenTofu
    env:
      TF_ACC: "1"
      TF_ACC_PROVIDER_HOST: registry.opentofu.org
    cmds:
      - TF_ACC_TERRAFORM_PATH="$(.github/scripts/install-tofu.sh)" go test -v ./internal/provider/...
  docs:
    desc: Generate the provider reference into docs/ with tfplugindocs, as the webpage build does
    cmds:
      - bash .github/scripts/ci/generate-docs.sh
  commit-msg:
    desc: Check a commit message file against Conventional Commits
    cmds:
      - '{{.FORGEGO}} commit-msg {{.CLI_ARGS}}'
