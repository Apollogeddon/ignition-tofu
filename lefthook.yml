lefthook: go tool -modfile=.forgego/lefthook/go.mod lefthook

pre-commit:
  commands:
    format:
      glob: "*.go"
      run: go tool -modfile=.forgego/golangci-lint/go.mod golangci-lint fmt {staged_files}
      stage_fixed: true
    sync-check:
      run: go tool -modfile=.forgego/task/go.mod task sync-check
    shellcheck:
      glob: "*.sh"
      exclude: "examples/**/import.sh"
      # CI runs shellcheck on every script, so the hook doesn't insist it's installed
      run: |
        if command -v shellcheck >/dev/null; then shellcheck {staged_files}
        else echo "shellcheck isn't installed: skipping, CI checks the scripts"; fi
pre-push:
  commands:
    lint:
      glob: "*.go"
      run: go tool -modfile=.forgego/golangci-lint/go.mod golangci-lint run
commit-msg:
  commands:
    conventional-commit:
      run: go tool -modfile=.forgego/task/go.mod task commit-msg -- {1}
